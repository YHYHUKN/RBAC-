server:
  port: 8080

spring:
  application:
    name: rbac-admin
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:rbac;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

jwt:
  # 演示占位密钥；生产环境请替换为高强度密钥（建议通过环境变量 JWT_SECRET 注入）
  secret: "CHANGE_ME_repository_demo_jwt_secret"
  expiration: 86400000

cors:
  allowed-origins: "*"
